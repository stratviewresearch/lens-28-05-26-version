  <body>
    <div id="root">
      <style>
        body { margin: 0; }
        .loader-wrapper {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background-color: #f8fafc;
        }
        .loader-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        }
        .loader-spinner {
          width: 48px;
          height: 48px;
          border-radius: 50%;
          border-bottom: 2px solid #1b4263;
          animation: spin 1s linear infinite;
        }
        .loader-text {
          font-family: sans-serif;
          font-size: 14px;
          color: #64748b;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: .5; }
        }
      </style>
      <div class="loader-wrapper">
        <div class="loader-content">
          <div class="loader-spinner"></div>
          <p class="loader-text">Verifying access...</p>
        </div>
      </div>
    </div>
